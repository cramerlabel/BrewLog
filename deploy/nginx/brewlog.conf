# BrewLog nginx site config.
#
# Serves the built client (static files) and reverse-proxies /api to the Node service running
# on 127.0.0.1:4000 (managed by the brewlog-api systemd unit — see deploy/systemd/).
#
# Install: copy to /etc/nginx/sites-available/brewlog.conf, symlink into sites-enabled, then
# `nginx -t && systemctl reload nginx`. See the "Deployment" section in README.md for the full
# runbook, including obtaining certs with certbot.

# Redirect all plain HTTP to HTTPS.
server {
    listen 80;
    listen [::]:80;
    server_name brewlog.example.com;

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name brewlog.example.com;

    # Managed by certbot (certbot --nginx) - paths shown are certbot's default layout.
    ssl_certificate     /etc/letsencrypt/live/brewlog.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/brewlog.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    # The built client (output of `npm run build -w client`, i.e. client/dist).
    root /opt/brewlog/client/dist;
    index index.html;

    client_max_body_size 6M; # slightly above the server's 5MB per-photo upload limit

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Vite fingerprints these filenames, so they're safe to cache indefinitely.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # SPA fallback - client-side react-router handles the actual route.
    location / {
        add_header X-Content-Type-Options nosniff always;
        try_files $uri /index.html;
    }

    # Reverse-proxy to the Node API. Trailing slash on both `location` and `proxy_pass` strips
    # the /api prefix... except the app itself is mounted at /api/*, so keep the prefix intact
    # by NOT using a trailing slash on proxy_pass.
    location /api/ {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
